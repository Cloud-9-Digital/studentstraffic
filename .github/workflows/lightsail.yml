name: Lightsail CI and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/lightsail-ci-cd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'lightsail-production' || github.event_name == 'push' && github.ref == 'refs/heads/codex/lightsail-ci-cd' && 'lightsail-rehearsal' || 'lightsail-checks' }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
      - run: npm ci
      - name: Run checks
        run: |
          node ops/lightsail/lint.mjs
          npm exec next typegen
          npm run typecheck
          npm test
      - name: Prepare a temporary build database
        run: |
          pg_bin="$(pg_config --bindir)"
          pg_data="$RUNNER_TEMP/studentstraffic-postgres"
          "$pg_bin/initdb" -D "$pg_data" --auth=trust --username=st_build
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/studentstraffic-postgres.log" \
            -o "-h 127.0.0.1 -p 55481 -k $RUNNER_TEMP" -w start
          export DATABASE_URL=postgresql://st_build@127.0.0.1:55481/postgres
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          npm exec drizzle-kit -- push --force
      - name: Load the published catalogue into the build database
        if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/lightsail-ci-cd' && vars.LIGHTSAIL_REHEARSAL_ENABLED == '1') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LIGHTSAIL_PRODUCTION_ENABLED == '1')
        env:
          DATABASE_URL: postgresql://st_build@127.0.0.1:55481/postgres
          RELEASE_SSH_USER: ${{ github.ref == 'refs/heads/main' && 'st_ci_production' || 'st_ci_rehearsal' }}
          RELEASE_SSH_KEY: ${{ github.ref == 'refs/heads/main' && secrets.LIGHTSAIL_PRODUCTION_KEY || secrets.LIGHTSAIL_REHEARSAL_KEY }}
          RELEASE_SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          archive="$RUNNER_TEMP/public-catalogue.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bash ops/lightsail/send.sh catalog "$archive"
          bash ops/lightsail/import-catalog.sh "$archive"
      - name: Build the release
        env:
          DATABASE_URL: postgresql://st_build@127.0.0.1:55481/postgres
          NEXT_PUBLIC_SITE_URL: https://www.studentstraffic.com
          NEXT_PUBLIC_AGORA_APP_ID: ${{ vars.LIGHTSAIL_PUBLIC_AGORA_APP_ID }}
          # Compile the same public chat launcher as production without a usable API key.
          ANTHROPIC_API_KEY: build-time-placeholder
          LIGHTSAIL_STANDALONE: '1'
          LIGHTSAIL_DEPLOYMENT_ID: ${{ github.sha }}
        run: npm run build
      - name: Package the exact commit
        shell: bash
        run: bash ops/lightsail/package.sh "$GITHUB_SHA" "$RUNNER_TEMP/studentstraffic.tar.gz"
      - name: Deploy to the private rehearsal
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/lightsail-ci-cd' && vars.LIGHTSAIL_REHEARSAL_ENABLED == '1'
        env:
          RELEASE_SSH_USER: st_ci_rehearsal
          RELEASE_SSH_KEY: ${{ secrets.LIGHTSAIL_REHEARSAL_KEY }}
          RELEASE_SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: bash ops/lightsail/send.sh "$GITHUB_SHA" "$RUNNER_TEMP/studentstraffic.tar.gz"
      - name: Deploy to production
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.LIGHTSAIL_PRODUCTION_ENABLED == '1'
        env:
          RELEASE_SSH_USER: st_ci_production
          RELEASE_SSH_KEY: ${{ secrets.LIGHTSAIL_PRODUCTION_KEY }}
          RELEASE_SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: bash ops/lightsail/send.sh "$GITHUB_SHA" "$RUNNER_TEMP/studentstraffic.tar.gz"
